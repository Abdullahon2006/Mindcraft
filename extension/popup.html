<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
    <title>MindCraft — Extend Your Mind</title>
  </head>
  <body>
    <main class="popup-container">
      <header class="popup-header">
        <div class="brand">
          <img src="icons/icon.svg" alt="MindCraft Logo" class="brand-logo" width="30" height="30">
          <div class="brand-text">
            <h1 class="brand-title">MindCraft</h1>
            <div class="connection-status">
              <span class="status-dot connected" id="status-dot"></span>
              <span id="page-host" class="host-label">Local Sanctuary</span>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button id="open-mindcraft" class="action-btn" title="Open MindCraft Library (⌘O)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </button>
          <button id="settings" class="action-btn" title="Extension Settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </header>

      <form id="capture-form" class="capture-form">
        <!-- Tactile Archetype Selector Chips -->
        <div class="kind-chips" id="kind-chips">
          <button type="button" class="chip active" data-kind="auto">
            <span class="chip-dot"></span>Auto
          </button>
          <button type="button" class="chip" data-kind="article">Article</button>
          <button type="button" class="chip" data-kind="quote">Quote</button>
          <button type="button" class="chip" data-kind="image">Image</button>
          <button type="button" class="chip" data-kind="color">Color</button>
          <button type="button" class="chip" data-kind="note">Note</button>
          <button type="button" class="chip" data-kind="link">Link</button>
        </div>

        <!-- Dynamic Context Preview Card -->
        <div id="preview-card" class="preview-card hidden">
          <div class="preview-media">
            <img id="preview-image" src="" alt="Thumbnail" class="preview-img hidden">
            <div id="preview-color" class="preview-color hidden"></div>
          </div>
          <div class="preview-content">
            <div class="preview-top">
              <span id="preview-badge" class="preview-badge">Article</span>
              <span id="preview-info" class="preview-info"></span>
            </div>
            <p id="preview-snippet" class="preview-snippet"></p>
          </div>
        </div>

        <!-- Form Fields -->
        <div class="input-group">
          <label for="title" class="input-label">Title</label>
          <input id="title" class="input-control" required placeholder="Memory or page title">
        </div>
        
        <div class="input-group">
          <label for="note" class="input-label">Reflection, Note or Quote</label>
          <textarea id="note" class="input-control textarea" rows="2" placeholder="Why keep this thought?"></textarea>
        </div>

        <div class="form-grid">
          <div class="input-group">
            <label for="collection" class="input-label">Space</label>
            <input id="collection" class="input-control" value="Inbox" placeholder="Space name">
          </div>
          <div class="input-group">
            <label for="tags" class="input-label">Tags</label>
            <input id="tags" class="input-control" placeholder="design, ideas">
          </div>
        </div>

        <button class="primary-btn" id="save" type="submit">
          <span>Remember into MindCraft</span>
          <kbd class="key-badge">⌘↵</kbd>
        </button>
      </form>

      <p id="status" class="status-msg" role="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
