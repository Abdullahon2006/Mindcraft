<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B382B"/>
      <stop offset="100%" stop-color="#13261D"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Squircle Base with tactile shadow -->
  <rect width="128" height="128" rx="32" fill="url(#mcGrad)"/>
  
  <!-- Sacred Minimalist Mind Loop: A continuous fluid ribbon forming the dual hemispheres of a contemplative mind & subtle 'M' -->
  <path d="M 38 78 C 38 52, 54 40, 64 56 C 74 40, 90 52, 90 78 C 90 88, 80 94, 64 85 C 48 94, 38 88, 38 78 Z" 
        fill="none" 
        stroke="#F7F4EC" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Centered golden awareness spark / locus of insight -->
  <circle cx="64" cy="56" r="4.5" fill="#E5A955"/>
</svg>